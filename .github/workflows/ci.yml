name: engineering-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintained user guide
        run: python scripts/check_user_guide.py
        env:
          USER_GUIDE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pip install -r requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: python scripts/build.py
      - run: python -m pytest -q
